services:
  - type: web
    name: household-account-book
    env: python
    buildCommand: pip install uv && uv sync --frozen
    startCommand: uv run gunicorn run:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      # Render が自動生成する強力なランダムキー
      - key: FLASK_SECRET_KEY
        generateValue: true
      # ----- 手動で設定が必要な変数（Render ダッシュボードで入力）-----
      # アプリへのアクセスを保護する Basic 認証の認証情報
      - key: APP_USERNAME
        sync: false
      - key: APP_PASSWORD
        sync: false
      # Gmail OAuth 用 credentials.json の内容をそのまま貼り付ける
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      # デプロイ後に確定する Render の URL を設定する
      # 例: https://household-account-book-xxxx.onrender.com/gmail/oauth/callback
      - key: GMAIL_REDIRECT_URI
        sync: false
      # PostgreSQL の接続 URL（下の databases セクションから自動設定）
      - key: DATABASE_URL
        fromDatabase:
          name: household-db
          property: connectionString

databases:
  - name: household-db
    plan: free
