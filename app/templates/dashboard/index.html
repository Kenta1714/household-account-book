{% extends "base.html" %}
{% block title %}ダッシュボード - 家計簿{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
  <h4 class="mb-0"><i class="bi bi-house"></i> ダッシュボード</h4>
  <div class="d-flex gap-2 align-items-center">
    <select id="yearSelect" class="form-select form-select-sm" style="width:auto">
      {% for y in range(today.year - 2, today.year + 1) %}
        <option value="{{ y }}" {% if y == today.year %}selected{% endif %}>{{ y }}年</option>
      {% endfor %}
    </select>
    <select id="monthSelect" class="form-select form-select-sm" style="width:auto">
      {% for m in range(1, 13) %}
        <option value="{{ m }}" {% if m == today.month %}selected{% endif %}>{{ m }}月</option>
      {% endfor %}
    </select>
  </div>
</div>

<!-- サマリーカード -->
<div class="row g-3 mb-4">
  <div class="col-md-4">
    <div class="card border-0 shadow-sm">
      <div class="card-body">
        <div class="text-muted small">収入</div>
        <div class="fs-3 fw-bold text-success" id="summaryIncome">-</div>
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card border-0 shadow-sm">
      <div class="card-body">
        <div class="text-muted small">支出</div>
        <div class="fs-3 fw-bold text-danger" id="summaryExpense">-</div>
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card border-0 shadow-sm">
      <div class="card-body">
        <div class="text-muted small">収支</div>
        <div class="fs-3 fw-bold" id="summaryBalance">-</div>
      </div>
    </div>
  </div>
</div>

<!-- グラフ -->
<div class="row g-3 mb-4">
  <div class="col-md-8">
    <div class="card border-0 shadow-sm">
      <div class="card-body">
        <h6 class="card-title text-muted">月別収支（年間）</h6>
        <canvas id="monthlyChart" height="120"></canvas>
      </div>
    </div>
  </div>
  <div class="col-md-4">
    <div class="card border-0 shadow-sm">
      <div class="card-body">
        <h6 class="card-title text-muted">支出カテゴリ内訳</h6>
        <canvas id="categoryChart" height="200"></canvas>
      </div>
    </div>
  </div>
</div>

<!-- 直近取引 -->
<div class="card border-0 shadow-sm">
  <div class="card-body">
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h6 class="card-title text-muted mb-0">直近の取引</h6>
      <a href="{{ url_for('transactions.index') }}" class="small">すべて見る</a>
    </div>
    <div id="recentTransactions">
      <div class="text-center text-muted py-3">読み込み中...</div>
    </div>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
const fmt = (n) => `¥${n.toLocaleString()}`;
let monthlyChart = null;
let categoryChart = null;

function getSelected() {
  return {
    year: parseInt(document.getElementById('yearSelect').value),
    month: parseInt(document.getElementById('monthSelect').value),
  };
}

async function loadSummary() {
  const {year, month} = getSelected();
  const res = await fetch(`/api/summary?year=${year}&month=${month}`);
  const d = await res.json();
  document.getElementById('summaryIncome').textContent = fmt(d.income);
  document.getElementById('summaryExpense').textContent = fmt(d.expense);
  const balEl = document.getElementById('summaryBalance');
  balEl.textContent = fmt(d.balance);
  balEl.className = `fs-3 fw-bold ${d.balance >= 0 ? 'text-success' : 'text-danger'}`;
}

async function loadMonthlyChart() {
  const {year} = getSelected();
  const res = await fetch(`/api/monthly_trend?year=${year}`);
  const data = await res.json();
  const labels = data.map(d => `${d.month}月`);
  const incomes = data.map(d => d.income);
  const expenses = data.map(d => d.expense);

  if (monthlyChart) monthlyChart.destroy();
  monthlyChart = new Chart(document.getElementById('monthlyChart'), {
    type: 'bar',
    data: {
      labels,
      datasets: [
        {label: '収入', data: incomes, backgroundColor: 'rgba(89,161,79,0.7)'},
        {label: '支出', data: expenses, backgroundColor: 'rgba(225,87,89,0.7)'},
      ]
    },
    options: {
      responsive: true,
      plugins: {legend: {position: 'top'}},
      scales: {y: {ticks: {callback: v => `¥${v.toLocaleString()}`}}}
    }
  });
}

async function loadCategoryChart() {
  const {year, month} = getSelected();
  const res = await fetch(`/api/category_breakdown?year=${year}&month=${month}&type=expense`);
  const data = await res.json();

  if (categoryChart) categoryChart.destroy();
  if (data.length === 0) {
    document.getElementById('categoryChart').closest('.card-body').innerHTML =
      '<h6 class="card-title text-muted">支出カテゴリ内訳</h6><p class="text-muted text-center py-4">データなし</p>';
    return;
  }
  categoryChart = new Chart(document.getElementById('categoryChart'), {
    type: 'doughnut',
    data: {
      labels: data.map(d => d.name),
      datasets: [{data: data.map(d => d.total), backgroundColor: data.map(d => d.color)}]
    },
    options: {
      responsive: true,
      plugins: {
        legend: {position: 'bottom', labels: {boxWidth: 12}},
        tooltip: {callbacks: {label: ctx => `${ctx.label}: ¥${ctx.raw.toLocaleString()}`}}
      }
    }
  });
}

async function loadRecentTransactions() {
  const {year, month} = getSelected();
  const res = await fetch(`/api/transactions?year=${year}&month=${month}&limit=10`);
  const data = await res.json();
  const el = document.getElementById('recentTransactions');
  if (!data.length) {
    el.innerHTML = '<p class="text-muted text-center py-2">取引なし</p>';
    return;
  }
  el.innerHTML = `<div class="list-group list-group-flush">${
    data.map(t => `
      <div class="list-group-item px-0">
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <span class="badge rounded-pill me-1" style="background:${t.category_color || '#adb5bd'}">${t.category_name || '未分類'}</span>
            ${t.description}
            <small class="text-muted ms-1">${t.date}</small>
          </div>
          <div class="fw-bold ${t.type === 'income' ? 'text-success' : 'text-danger'}">
            ${t.type === 'income' ? '+' : '-'}¥${t.amount.toLocaleString()}
          </div>
        </div>
      </div>`).join('')
  }</div>`;
}

async function reload() {
  await Promise.all([loadSummary(), loadMonthlyChart(), loadCategoryChart(), loadRecentTransactions()]);
}

document.getElementById('yearSelect').addEventListener('change', reload);
document.getElementById('monthSelect').addEventListener('change', reload);

reload();
</script>
{% endblock %}
