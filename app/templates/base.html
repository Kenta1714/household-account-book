<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}家計簿{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <!-- ホーム画面アイコン -->
  <link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ url_for('static', filename='icon-192.png') }}">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="家計簿">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand fw-bold" href="{{ url_for('dashboard.index') }}">
      <i class="bi bi-wallet2"></i> 家計簿
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint and request.endpoint.startswith('dashboard') %}active{% endif %}"
             href="{{ url_for('dashboard.index') }}">
            <i class="bi bi-house"></i> ダッシュボード
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint and request.endpoint.startswith('transactions') %}active{% endif %}"
             href="{{ url_for('transactions.index') }}">
            <i class="bi bi-list-ul"></i> 取引一覧
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint and request.endpoint.startswith('categories') %}active{% endif %}"
             href="{{ url_for('categories.index') }}">
            <i class="bi bi-tags"></i> カテゴリ
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint and request.endpoint.startswith('gmail') %}active{% endif %}"
             href="{{ url_for('gmail.index') }}">
            <i class="bi bi-envelope"></i> Gmail連携
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint and request.endpoint.startswith('paypay') %}active{% endif %}"
             href="{{ url_for('paypay.index') }}">
            <i class="bi bi-upload"></i> PayPay
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="container-fluid py-4">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
      <div class="alert alert-{{ category }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
      </div>
    {% endfor %}
  {% endwith %}

  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
